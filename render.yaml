# Render Blueprint — https://render.com/docs/blueprint-spec
# Apply via: Render dashboard → New → Blueprint → connect this repo.

services:
  - type: web
    name: customer-chat
    runtime: node
    plan: starter # $7/mo, always-on. Free plan sleeps and breaks Socket.IO.
    region: oregon # change if you prefer fra / singapore / etc.
    branch: main
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/ready
    autoDeploy: true

    # Persistent disk for data/*.json (JsonDB).
    # Without this, every deploy wipes users / tickets / sites / chat history.
    disk:
      name: chat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value once.
      - key: ALLOWED_ORIGINS
        sync: false # set in dashboard, e.g. https://yoursite.com,https://www.yoursite.com

      # Bootstrap admin (used only when users.json is empty / first boot).
      # Set BOTH in the Render dashboard. Once any user exists these are
      # ignored — rotation is a deliberate manual step.
      #
      # Generate a hash locally with:  npm run hash-password
      # Then paste the resulting "$2b$12$..." string into the dashboard.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD_HASH
        sync: false
